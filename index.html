<title>CineBimbo</title>
<style>
:root{
  color-scheme: light only;
  /* iOS system palette */
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --surface-2:#FBFBFD;
  --label:#000000;
  --label-2:rgba(60,60,67,.60);
  --label-3:rgba(60,60,67,.30);
  --sep:rgba(60,60,67,.20);
  --fill:rgba(118,118,128,.12);
  --fill-2:rgba(118,118,128,.08);
  --blue:#007AFF;
  --blue-deep:#0A4DA6;
  --blue-soft:#E8F1FF;
  --navy:#0A2240;
  --green:#34C759;
  --red:#FF3B30;
  --orange:#FF9500;
  --radius-card:18px;
  --radius-row:14px;
  --tabbar-h:78px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:17px;
  line-height:1.4;
  overscroll-behavior-y:none;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;}
input,textarea{font-family:inherit;font-size:17px;}
.app{max-width:460px;margin:0 auto;}

/* ============ Nav bar (glass) ============ */
.nav{
  position:sticky;top:0;z-index:40;
  padding:env(safe-area-inset-top) 0 0;
  background:linear-gradient(180deg,rgba(250,251,253,.90) 0%,rgba(242,242,247,.70) 100%);
  -webkit-backdrop-filter:saturate(210%) blur(28px);
  backdrop-filter:saturate(210%) blur(28px);
  transition:border-color .2s,box-shadow .2s;
  border-bottom:.5px solid transparent;
}
.nav.scrolled{box-shadow:0 1px 14px rgba(10,30,70,.05);}
.nav.scrolled{border-bottom-color:var(--sep);}
.nav-row{display:flex;align-items:center;gap:10px;padding:6px 18px 8px;min-height:44px;}
.nav-small{font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;flex:1;text-align:center;}
.nav.scrolled .nav-small{opacity:1;}
.nav-action{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--blue);
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.35));
  -webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,1),inset 0 0 0 .5px rgba(255,255,255,.7),
             0 1px 3px rgba(10,30,70,.10),0 0 14px rgba(0,122,255,.10);
  transition:transform .14s,background .14s;flex:0 0 auto;
}
.nav-action:active{transform:scale(.9);background:rgba(118,118,128,.2);}
.nav-action svg{width:19px;height:19px;}
.nav-spacer{width:34px;flex:0 0 auto;}

.large-title{padding:2px 18px 10px;}
.large-title h1{font-size:34px;font-weight:700;letter-spacing:-.8px;margin:0;line-height:1.1;}
.large-title p{margin:3px 0 0;font-size:15px;color:var(--label-2);}

/* ============ Segmented control ============ */
.seg{
  position:relative;display:flex;margin:4px 18px 0;background:var(--fill);
  border-radius:9px;padding:2px;isolation:isolate;
}
.seg-thumb{
  position:absolute;top:2px;bottom:2px;border-radius:7px;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  transition:transform .26s cubic-bezier(.4,.9,.3,1),width .26s;z-index:-1;
}
.seg-btn{flex:1;padding:7px 0;font-size:13px;font-weight:600;color:var(--label);text-align:center;letter-spacing:-.1px;}
.seg-btn:not(.active){color:var(--label-2);font-weight:500;}

/* ============ Filter bar ============ */
.filterbar{display:flex;align-items:center;gap:8px;padding:14px 18px 2px;}
.sortpill{
  display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;
  font-size:13.5px;font-weight:600;color:var(--label);flex:0 0 auto;
  background:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.45));
  -webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,1),inset 0 0 0 .5px rgba(10,30,70,.06),0 1px 3px rgba(10,30,70,.06);
  transition:background .16s,color .16s,box-shadow .16s;
}
.sortpill svg{width:13px;height:13px;color:var(--label-2);}
.sortpill.on{
  background:linear-gradient(180deg,#2E95FF,#007AFF);color:#fff;
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.55),0 2px 8px rgba(0,122,255,.30),0 0 16px rgba(0,122,255,.18);
}
.sortpill.on svg{color:#fff;}
.count-note{margin-left:auto;font-size:13px;color:var(--label-2);}

.chips-label{font-size:12px;font-weight:650;color:var(--label-2);padding:15px 18px 0;letter-spacing:.2px;}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 18px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chips-hint{font-size:12.5px;color:var(--label-3);padding:7px 18px 0;line-height:1.4;}
.chip{
  flex:0 0 auto;padding:6px 13px;border-radius:999px;font-size:13.5px;font-weight:500;
  color:var(--label);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.58));
  -webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,1),inset 0 0 0 .5px rgba(10,30,70,.07),0 1px 2px rgba(10,30,70,.05);
  transition:background .16s,color .16s,box-shadow .16s;
}
.chip.on{
  background:linear-gradient(180deg,#2E95FF,#007AFF);color:#fff;font-weight:600;
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.5),0 2px 9px rgba(0,122,255,.32),0 0 16px rgba(0,122,255,.16);
}
.chip.on .dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.9);}

/* ============ Content ============ */
.view{display:none;}
.view.show{display:block;}
.sec{padding:26px 18px 0;}
.sec-head{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;}
.sec-head h2{font-size:22px;font-weight:700;letter-spacing:-.5px;margin:0;}
.sec-head span{font-size:14px;color:var(--label-2);margin-left:auto;}

.list{padding:14px 18px 10px;display:flex;flex-direction:column;gap:11px;}

/* Card */
.card{
  background:var(--surface);border-radius:var(--radius-card);padding:13px 14px;
  box-shadow:0 1px 2px rgba(0,0,0,.045),0 6px 18px rgba(10,30,70,.045);
  animation:pop .3s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99);}to{opacity:1;transform:none;}}
.card-main{display:flex;gap:12px;align-items:flex-start;}
.card-tap{display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0;text-align:left;transition:opacity .12s;}
.card-tap:active{opacity:.55;}
.score{
  flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  font-size:16.5px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;
}
.card-title{font-size:16.5px;font-weight:600;letter-spacing:-.35px;margin:1px 0 0;line-height:1.25;}
.card-sub{font-size:13px;color:var(--label-2);margin-top:2px;}
.check{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--label-3);color:transparent;transition:all .18s;margin-top:7px;
}
.check svg{width:16px;height:16px;}
.check.done{background:var(--green);border-color:var(--green);color:#fff;}
.check:not(.done):active{border-color:var(--blue);background:var(--blue-soft);}
.card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;}
.tag{font-size:11.5px;font-weight:600;padding:3.5px 8px;border-radius:7px;background:var(--fill-2);color:var(--label-2);}
.tag-blue{background:var(--blue-soft);color:#0A5BC4;}
.stream{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3.5px 9px;border-radius:7px;background:var(--fill-2);color:var(--label);}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.rate-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.rate{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3.5px 8px;border-radius:7px;}
.rate b{font-variant-numeric:tabular-nums;font-weight:700;}
.r-mine{background:var(--blue-soft);color:#0A5BC4;}
.r-imdb{background:#FFF4D6;color:#8A6400;}
.r-rt{background:#FFE8E6;color:#B3261E;}

.empty{text-align:center;padding:70px 32px;color:var(--label-2);}
.empty svg{width:46px;height:46px;color:var(--label-3);margin-bottom:12px;}
.empty h3{font-size:19px;font-weight:650;color:var(--label);margin:0 0 5px;letter-spacing:-.4px;}
.empty p{font-size:15px;margin:0;line-height:1.45;}

/* ============ Central ============ */
.hero{
  margin:6px 18px 0;border-radius:22px;padding:19px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#0A4DA6 0%,#0A2240 100%);
  box-shadow:0 10px 30px rgba(10,34,64,.30);
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 80% at 85% -10%,rgba(255,255,255,.22),transparent 60%);
}
.hero-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:rgba(255,255,255,.72);}
.hero-title{font-size:25px;font-weight:700;letter-spacing:-.7px;margin:7px 0 0;line-height:1.15;}
.hero-sub{font-size:13.5px;color:rgba(255,255,255,.75);margin-top:4px;}
.hero-desc{font-size:14px;line-height:1.45;color:rgba(255,255,255,.88);margin:11px 0 0;}
.hero-acts{display:flex;gap:9px;margin-top:16px;position:relative;z-index:1;}
.hero-acts button{
  flex:1;padding:12px;border-radius:13px;font-size:14.5px;font-weight:600;transition:transform .12s,background .14s;
}
.hero-acts button:active{transform:scale(.97);}
.h-primary{background:#fff;color:var(--blue-deep);}
.h-ghost{background:rgba(255,255,255,.17);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}

/* ranked rows */
.rank-list{background:var(--surface);border-radius:var(--radius-card);overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.045),0 6px 18px rgba(10,30,70,.045);}
.rank{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;transition:background .12s;}
.rank:active{background:var(--fill-2);}
.rank + .rank{border-top:.5px solid var(--sep);}
.rank-n{flex:0 0 auto;width:21px;font-size:15px;font-weight:700;color:var(--label-3);font-variant-numeric:tabular-nums;text-align:center;}
.rank-body{flex:1;min-width:0;}
.rank-title{font-size:15.5px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-sub{font-size:12.5px;color:var(--label-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-score{flex:0 0 auto;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.rank-chev{flex:0 0 auto;width:8px;height:13px;color:var(--label-3);}

.cta{
  margin:16px 18px 0;background:var(--surface);border-radius:var(--radius-card);padding:16px;
  display:flex;align-items:center;gap:14px;width:calc(100% - 36px);text-align:left;
  box-shadow:0 1px 2px rgba(0,0,0,.045),0 6px 18px rgba(10,30,70,.045);transition:transform .12s;
}
.cta:active{transform:scale(.985);}
.cta-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(145deg,#0A84FF,#0A4DA6);color:#fff;}
.cta-ic svg{width:25px;height:25px;}
.cta b{display:block;font-size:16px;font-weight:650;letter-spacing:-.35px;}
.cta span{display:block;font-size:13.5px;color:var(--label-2);margin-top:2px;}

/* ============ Roulette ============ */
.wheel-wrap{position:relative;width:100%;max-width:320px;margin:18px auto 0;aspect-ratio:1;display:grid;place-items:center;}
.wheel-pin{
  position:absolute;top:-3px;left:50%;transform:translateX(-50%);z-index:3;
  width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
  border-top:21px solid var(--navy);filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
}
.wheel-hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
  width:62px;height:62px;border-radius:50%;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  display:grid;place-items:center;pointer-events:none;
  box-shadow:0 0 0 .5px rgba(255,255,255,.8) inset,0 4px 14px rgba(10,30,70,.18);
}
.wheel-hub b{font-size:21px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1;}
.wheel-hub span{display:block;font-size:9px;color:var(--label-2);font-weight:600;letter-spacing:.3px;margin-top:1px;}
#wheelSvg{width:100%;height:100%;transition:transform 4.6s cubic-bezier(.15,.72,.13,1);filter:drop-shadow(0 6px 18px rgba(10,30,70,.18));}
.spin-btn{
  display:block;width:calc(100% - 36px);max-width:320px;margin:20px auto 0;padding:16px;border-radius:16px;
  background:var(--blue);color:#fff;font-size:17px;font-weight:650;letter-spacing:-.3px;
  box-shadow:0 8px 22px rgba(0,122,255,.30);transition:transform .12s,background .14s;
}
.spin-btn:active{transform:scale(.975);background:#0062CC;}
.spin-btn:disabled{background:var(--fill);color:var(--label-3);box-shadow:none;}
.roul-note{text-align:center;font-size:13.5px;color:var(--label-2);padding:12px 24px 0;line-height:1.45;}
/* resultado do sorteio: modal sobre a tela */
.res-scrim{
  position:fixed;inset:0;z-index:95;background:rgba(6,16,38,.42);opacity:0;pointer-events:none;
  transition:opacity .3s;-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
}
.res-scrim.show{opacity:1;pointer-events:auto;}
.res-modal{
  position:fixed;z-index:96;left:0;right:0;top:50%;
  display:flex;justify-content:center;padding:0 18px;
  transform:translateY(-50%) scale(.90);opacity:0;pointer-events:none;
  transition:transform .42s cubic-bezier(.2,1.1,.3,1),opacity .28s;
}
.res-modal.show{transform:translateY(-50%) scale(1);opacity:1;pointer-events:auto;}
.res-card{
  width:100%;max-width:380px;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-radius:26px;padding:20px;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.90));
  -webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 0 0 .5px rgba(255,255,255,.7),
    0 0 0 .5px rgba(10,30,70,.07),
    0 26px 60px rgba(10,30,70,.30),
    0 8px 20px rgba(10,30,70,.14);
}
.res-close{
  position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;color:var(--label-2);background:var(--fill);transition:transform .14s;
}
.res-close svg{width:15px;height:15px;}
.res-close:active{transform:scale(.88);}
.res-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);}
.res-acts{display:flex;flex-direction:column;gap:9px;margin-top:17px;}
.res-acts button{width:100%;padding:14px;border-radius:14px;font-size:15.5px;font-weight:650;transition:transform .12s;}
.res-acts button:active{transform:scale(.975);}
.res-watch{background:linear-gradient(180deg,#2E95FF,#007AFF);color:#fff;box-shadow:0 5px 16px rgba(0,122,255,.30);}
.res-again{
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.5));color:var(--blue);
  box-shadow:inset 0 0 0 .5px rgba(0,122,255,.30),0 1px 3px rgba(10,30,70,.07);
}

/* ============ Tab bar — Liquid Glass ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  padding:0 14px calc(env(safe-area-inset-bottom) + 9px);
  pointer-events:none;display:flex;justify-content:center;
}
.tabbar-inner{
  pointer-events:auto;position:relative;display:flex;width:100%;max-width:430px;
  padding:7px;border-radius:30px;isolation:isolate;overflow:hidden;
  /* vidro: camada translúcida com densidade variável de cima para baixo */
  background:linear-gradient(180deg,
    rgba(255,255,255,.74) 0%,
    rgba(255,255,255,.40) 48%,
    rgba(255,255,255,.60) 100%);
  -webkit-backdrop-filter:blur(42px) saturate(250%) brightness(1.07);
  backdrop-filter:blur(42px) saturate(250%) brightness(1.07);
  box-shadow:
    /* espessura do vidro: luz presa nas bordas internas */
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -1px 0 rgba(255,255,255,.62),
    inset 1px 0 0 rgba(255,255,255,.66),
    inset -1px 0 0 rgba(255,255,255,.66),
    inset 0 0 22px rgba(255,255,255,.34),
    /* contorno e profundidade */
    0 0 0 .5px rgba(10,30,70,.08),
    0 18px 42px rgba(10,30,70,.19),
    0 5px 14px rgba(10,30,70,.09);
}
/* brilho especular no topo da cápsula */
.tabbar-inner::before{
  content:"";position:absolute;left:0;right:0;top:0;height:58%;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.16) 58%,transparent 100%);
  border-radius:30px 30px 46% 46% / 30px 30px 20px 20px;
}
/* refração nas quinas */
.tabbar-inner::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:inherit;
  background:
    radial-gradient(120% 95% at 14% -25%,rgba(255,255,255,.60),transparent 58%),
    radial-gradient(95% 75% at 90% 125%,rgba(0,122,255,.12),transparent 62%);
}
.tab-pill{
  position:absolute;top:6px;bottom:6px;border-radius:24px;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(0,122,255,.26) 0%,rgba(0,122,255,.11) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.90),
    inset 0 0 0 .5px rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,122,255,.18),
    0 2px 7px rgba(0,122,255,.16),
    0 0 20px rgba(0,122,255,.18);
  transition:transform .40s cubic-bezier(.34,1.28,.46,1),width .40s cubic-bezier(.34,1.28,.46,1);
}
.tab-pill::after{
  content:"";position:absolute;left:0;right:0;top:0;height:52%;
  background:linear-gradient(180deg,rgba(255,255,255,.62),transparent);
  border-radius:24px 24px 50% 50% / 24px 24px 14px 14px;
}
.tab-item{
  position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0 5px;color:var(--label-2);transition:color .24s,transform .16s;
}
.tab-item svg{width:24px;height:24px;transition:filter .24s,transform .24s;}
.tab-item span{font-size:10px;font-weight:600;letter-spacing:-.1px;}
.tab-item.on{color:#0063D1;}
.tab-item.on svg{filter:drop-shadow(0 1px 4px rgba(0,122,255,.45));transform:translateY(-.5px);}
.tab-item.on span{font-weight:700;}
.tab-item:active{transform:scale(.90);}

/* ============ Sheet ============ */
.scrim{
  position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;
  transition:opacity .34s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:460px;margin:0 auto;
  background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(102%);
  transition:transform .42s cubic-bezier(.32,.72,0,1);
  max-height:93vh;display:flex;flex-direction:column;
  box-shadow:0 -1px 0 rgba(0,0,0,.07),0 -14px 44px rgba(0,0,0,.20);
}
.sheet.open{transform:none;}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:7px auto 0;flex:0 0 auto;}
.sheet-nav{
  display:flex;align-items:center;padding:10px 16px 12px;flex:0 0 auto;
  border-bottom:.5px solid var(--sep);
  background:rgba(242,242,247,.86);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
}
.sheet-nav .t{flex:1;text-align:center;font-size:17px;font-weight:650;letter-spacing:-.4px;}
.sheet-nav button{font-size:17px;color:var(--blue);min-width:62px;}
.sheet-nav button.strong{font-weight:650;text-align:right;}
.sheet-nav button:disabled{color:var(--label-3);}
.sheet-body{padding:18px 16px calc(34px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;}

.group{background:var(--surface);border-radius:12px;overflow:hidden;margin-bottom:22px;}
.group-label{font-size:13px;color:var(--label-2);padding:0 16px 7px;font-weight:500;}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:46px;}
.row + .row{border-top:.5px solid var(--sep);}
.row label{font-size:17px;flex:0 0 108px;}
.row input[type=text]{flex:1;min-width:0;border:none;outline:none;background:none;text-align:right;color:var(--label);}
.row input.num{width:84px;border:none;outline:none;background:none;text-align:right;color:var(--label);font-variant-numeric:tabular-nums;}
.mine-locked{display:none;align-items:center;gap:10px;padding:14px 16px;color:var(--label-2);font-size:13.5px;line-height:1.4;}
.mine-locked.show{display:flex;}
.mine-locked svg{width:19px;height:19px;flex:0 0 auto;color:var(--label-3);}
.mine-locked b{color:var(--label);font-weight:650;}
.row .unit{font-size:15px;color:var(--label-3);flex:0 0 auto;}
.row input::placeholder{color:var(--label-3);}
.ta{width:100%;border:none;outline:none;background:none;padding:12px 16px;resize:vertical;min-height:88px;line-height:1.45;color:var(--label);}
.pickwrap{padding:12px 14px;display:flex;flex-wrap:wrap;gap:7px;}
.pick{
  padding:8px 13px;border-radius:10px;font-size:14px;font-weight:500;
  background:var(--fill);color:var(--label);transition:background .14s,color .14s;
  display:inline-flex;align-items:center;gap:6px;
}
.pick.on{background:var(--blue);color:#fff;font-weight:600;}
.pick.on .dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.85);}
.slider-row{padding:14px 16px;}
.slider-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;}
.slider-top b{font-size:28px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;}
.slider-top span{font-size:14px;color:var(--label-2);}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
  background:var(--fill);outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 1px 1px rgba(0,0,0,.14),0 4px 10px rgba(0,0,0,.18);cursor:pointer;
}
input[type=range]::-moz-range-thumb{width:25px;height:25px;border-radius:50%;background:#fff;border:none;
  box-shadow:0 1px 1px rgba(0,0,0,.14),0 4px 10px rgba(0,0,0,.18);cursor:pointer;}
.clear-mine{font-size:13.5px;color:var(--blue);margin-top:12px;}
.del-row{
  width:100%;text-align:center;padding:14px;background:var(--surface);border-radius:12px;
  color:var(--red);font-size:17px;font-weight:500;transition:background .12s;
}
.del-row:active{background:#FFEBEA;}
.err{font-size:13px;color:var(--red);padding:0 16px 10px;display:none;}
.err.show{display:block;}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="app">
  <!-- Nav -->
  <header class="nav" id="nav">
    <div class="nav-row">
      <div class="nav-spacer" id="navLeft"></div>
      <div class="nav-small" id="navSmall">Central</div>
      <button class="nav-action" id="addBtn" aria-label="Adicionar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="large-title">
      <h1 id="bigTitle">Central</h1>
      <p id="bigSub"></p>
    </div>

    <!-- segmented control (lists only) -->
    <div class="seg" id="seg" style="display:none">
      <div class="seg-thumb" id="segThumb"></div>
      <button class="seg-btn active" data-status="prospect">Prospect</button>
      <button class="seg-btn" data-status="watched">Watched</button>
    </div>
  </header>

  <!-- ===== CENTRAL ===== -->
  <section class="view" id="viewCentral">
    <div id="heroSlot"></div>
    <div class="sec" id="secTopMovies"></div>
    <div class="sec" id="secTopSeries"></div>
    <button class="cta" id="ctaRoul">
      <div class="cta-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.3"/><path d="M12 3v6.7M21 12h-6.7M12 21v-6.7M3 12h6.7"/></svg>
      </div>

/* =================== storage =================== */
function load(){
  try{ const raw = localStorage.getItem(KEY); items = raw ? JSON.parse(raw) : []; }
  catch(e){ items = []; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }

// traz dados das versões antigas do app (rating único) para o novo formato
function migrate(){
  let changed = false;
  const legacyKeys = ["cinemateca:items:v1"];
  if(!items.length){
    for(const lk of legacyKeys){
      try{
        const raw = localStorage.getItem(lk);
        if(raw){ const old = JSON.parse(raw); if(Array.isArray(old) && old.length){ items = old; changed = true; break; } }
      }catch(e){}
    }
  }
  items.forEach(it=>{
    if(!it.ratings || typeof it.ratings !== "object"){
      it.ratings = {};
      if(typeof it.rating === "number"){
        // nota que eu mesmo dei fica como pessoal; nota de fila veio do IMDb
        if(it.status === "watched") it.ratings.mine = it.rating; else it.ratings.imdb = it.rating;
      }
      changed = true;
    }
    if("rating" in it){ delete it.rating; changed = true; }
    if(!Array.isArray(it.streaming)){ it.streaming = []; changed = true; }
    if(!Array.isArray(it.themes)){ it.themes = []; changed = true; }
  });
  if(changed) save();
}
// aplica uma vez as notas IMDb/RT e os streamings nos títulos que já estavam salvos
const ENRICHED = "cinebimbo:enriched:v1";
function enrich(){
  if(localStorage.getItem(ENRICHED)) return;
  const byId = new Map(SEEDS.map(s=>[s.id,s]));
  let changed = false;
  items.forEach(it=>{
    // 'Cinema' saiu da lista de streamings
    if(Array.isArray(it.streaming) && it.streaming.includes("Cinema")){
      it.streaming = it.streaming.filter(x=>x!=="Cinema"); changed = true;
    }
    const s = byId.get(it.id);
    if(!s) return;
    it.ratings = it.ratings || {};
    if(s.ratings.imdb != null && it.ratings.imdb !== s.ratings.imdb){ it.ratings.imdb = s.ratings.imdb; changed = true; }
    if(s.ratings.rt   != null && it.ratings.rt   == null){ it.ratings.rt = s.ratings.rt; changed = true; }
    if(s.streaming && s.streaming.length){
      const merged = [...new Set([...(it.streaming||[]), ...s.streaming])];
      if(merged.length !== (it.streaming||[]).length){ it.streaming = merged; changed = true; }
    }
  });
  if(changed) save();
  try{ localStorage.setItem(ENRICHED,"1"); }catch(e){}
}
function seed(){
  if(localStorage.getItem(SEEDED)) return;
  const have = new Set(items.map(i=>i.id));
  SEEDS.forEach(s=>{ if(!have.has(s.id)) items.push(JSON.parse(JSON.stringify(s))); });
  save();
  try{ localStorage.setItem(SEEDED,"1"); }catch(e){}
}

/* =================== notas =================== */
// minha nota só vale para o que já foi visto (o valor fica guardado se voltar para a fila)
function mineOf(it){
  return it.status==="watched" && it.ratings && it.ratings.mine!=null ? it.ratings.mine : null;
}
// nota de referência: a minha vem primeiro, depois IMDb, depois RT convertida
function primary(it){
  const r = it.ratings || {}, m = mineOf(it);
  if(m    != null) return m;
  if(r.imdb != null) return r.imdb;
  if(r.rt   != null) return r.rt/10;
  return null;
}
function fmt(n){ return n==null ? "–" : Number(n).toFixed(1); }
function lerp(a,b,t){ return Math.round(a+(b-a)*t); }
function scoreColor(n){
  if(n==null) return {bg:"rgba(118,118,128,.12)", fg:"rgba(60,60,67,.45)"};
  const t = Math.max(0,Math.min(1,n/10));
  return { bg:`rgb(${lerp(225,10,t)},${lerp(238,77,t)},${lerp(255,166,t)})`, fg: t>=.45 ? "#fff" : "#0A2240" };
}
function rateChips(it){
  const r = it.ratings || {}, out = [], m = mineOf(it);
  if(m != null) out.push(`<span class="rate r-mine">Minha <b>${fmt(m)}</b></span>`);
  if(r.imdb != null) out.push(`<span class="rate r-imdb">IMDb <b>${fmt(r.imdb)}</b></span>`);
  if(r.rt   != null) out.push(`<span class="rate r-rt">RT <b>${Math.round(r.rt)}%</b></span>`);
  return out.length ? `<div class="rate-row">${out.join("")}</div>` : "";
}
function streamChips(list){
  if(!list || !list.length) return "";
  return list.map(s=>`<span class="stream"><i class="dot" style="background:${STREAM_COLOR[s]||"#8E8E93"}"></i>${esc(s)}</span>`).join("");
}

/* =================== navegação =================== */
function moveSegThumb(segEl, thumbEl, activeEl){
  if(!activeEl) return;
  thumbEl.style.width = activeEl.offsetWidth + "px";
  thumbEl.style.transform = `translateX(${activeEl.offsetLeft - 2}px)`;
}
function syncSeg(){
  const el = [...document.querySelectorAll("#seg .seg-btn")].find(b=>b.dataset.status===state.status);
  moveSegThumb($("#seg"), $("#segThumb"), el);
}
function movePill(){
  const active = document.querySelector(".tab-item.on");
  if(!active) return;
  const pill = $("#tabPill");
  pill.style.width = active.offsetWidth + "px";
  pill.style.transform = `translateX(${active.offsetLeft - 7}px)`;
}

function setTab(tab){
  state.tab = tab;
  document.querySelectorAll(".tab-item").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  movePill();

  const isList = (tab==="movie" || tab==="series");
  if(isList){
    state.type = tab;
    state.status = "prospect";          // Prospect é sempre o padrão ao abrir a aba
    state.theme = "all";
    state.streams = [];
    document.querySelectorAll("#seg .seg-btn").forEach(b=>b.classList.toggle("active", b.dataset.status==="prospect"));
  }

  const title = tab==="central" ? "Página Central" : tab==="movie" ? "Filmes" : tab==="series" ? "Séries" : "Roleta";
  $("#bigTitle").textContent = title;
  $("#navSmall").textContent = title;
  $("#seg").style.display = isList ? "" : "none";
  $("#addBtn").style.display = tab==="roulette" ? "none" : "";

  $("#viewCentral").classList.toggle("show", tab==="central");
  $("#viewList").classList.toggle("show", isList);
  $("#viewRoul").classList.toggle("show", tab==="roulette");

  window.scrollTo({top:0, behavior:"auto"});

  if(tab==="central")      renderCentral();
  else if(isList)        { renderChips(); renderList(); requestAnimationFrame(syncSeg); }
  else                     renderRoulette();
  updateSub();
}
function updateSub(){
  const p = $("#bigSub");
  if(state.tab==="central"){
    const d = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
    p.textContent = d.charAt(0).toUpperCase()+d.slice(1);
  } else if(state.tab==="roulette"){
    p.textContent = "Sorteio entre os filmes da sua fila";
  } else {
    const n = items.filter(i=>i.type===state.type).length;
    p.textContent = `${n} ${state.type==="movie"?"filmes":"séries"} na coleção`;
  }
}

/* =================== CENTRAL =================== */
function topOf(type, n){
  return items.filter(i=>i.type===type && i.status==="prospect")
              .sort((a,b)=>{
                const pa=primary(a), pb=primary(b);
                if(pa==null && pb==null) return a.name.localeCompare(b.name,"pt");
                if(pa==null) return 1; if(pb==null) return -1;
                return pb-pa || a.name.localeCompare(b.name,"pt");
              }).slice(0,n);
}
function renderCentral(){
  // destaque: melhor avaliado da fila (filme ou série)
  const best = [...topOf("movie",1), ...topOf("series",1)]
    .sort((a,b)=>(primary(b)??-1)-(primary(a)??-1))[0];
  const slot = $("#heroSlot");
  if(best){
    const p = primary(best);
    slot.innerHTML = `
      <div class="hero">
        <div class="hero-eyebrow">Destaque da fila</div>
        <div class="hero-title">${esc(best.name)}</div>
        <div class="hero-sub">${best.director?esc(best.director)+" · ":""}${best.type==="movie"?"Filme":"Série"}${p!=null?" · "+fmt(p):""}</div>
        ${best.description?`<p class="hero-desc">${esc(best.description)}</p>`:""}
        <div class="hero-acts">
          <button class="h-primary" id="heroWatch">Marcar como visto</button>
          <button class="h-ghost" id="heroOpen">Ver detalhes</button>
        </div>
      </div>`;
    $("#heroWatch").onclick = ()=>{ toggleStatus(best.id); };
    $("#heroOpen").onclick  = ()=>openSheet(best.id);
  } else {
    slot.innerHTML = `<div class="hero"><div class="hero-eyebrow">Fila vazia</div>
      <div class="hero-title">Nada esperando por você</div>
      <p class="hero-desc">Toque em + para colocar um filme ou série na fila.</p></div>`;
  }

  renderRanked("#secTopMovies","Filmes para ver", topOf("movie",5),  "movie");
  renderRanked("#secTopSeries","Séries para ver", topOf("series",5), "series");

  const nf = items.filter(i=>i.type==="movie" && i.status==="prospect").length;
  $("#ctaSub").textContent = nf ? `Sorteia entre ${nf} filmes da sua fila` : "Coloque filmes na fila para girar";
}
function renderRanked(sel, title, rows, type){
  const el = $(sel);
  if(!rows.length){ el.innerHTML = ""; return; }
  const total = items.filter(i=>i.type===type && i.status==="prospect").length;
  el.innerHTML = `
    <div class="sec-head"><h2>${title}</h2><span>${total} na fila</span></div>
    <div class="rank-list">${rows.map((it,i)=>{
      const p = primary(it), sc = scoreColor(p);
      return `<button class="rank" data-id="${it.id}">
        <div class="rank-n">${i+1}</div>
        <div class="rank-body">
          <div class="rank-title">${esc(it.name)}</div>
          <div class="rank-sub">${it.director?esc(it.director):it.themes.slice(0,2).join(" · ")||"—"}</div>
        </div>
        <div class="rank-score" style="color:${p!=null?sc.bg.replace("rgb","rgb"):"var(--label-3)"}">${fmt(p)}</div>
        <svg class="rank-chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 6.5 6.5 1.5 11.5"/></svg>
      </button>`;
    }).join("")}</div>`;
  el.querySelectorAll(".rank").forEach(b=> b.onclick = ()=>openSheet(b.dataset.id));
}

/* =================== LISTA =================== */
function renderChips(){
  const base = items.filter(i=>i.type===state.type && i.status===state.status);
  const avail = new Set();
  base.forEach(i=>i.themes.forEach(t=>avail.add(t)));
  const wrap = $("#themeChips");
  wrap.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip" + (state.theme==="all" ? " on" : "");
  all.textContent = "Todos";
  all.onclick = ()=>{ state.theme="all"; renderChips(); renderList(); };
  wrap.appendChild(all);
  THEMES.filter(t=>avail.has(t)).forEach(t=>{
    const c = document.createElement("button");
    c.className = "chip" + (state.theme===t ? " on" : "");
    c.textContent = t;
    c.onclick = ()=>{ state.theme = state.theme===t ? "all" : t; renderChips(); renderList(); };
    wrap.appendChild(c);
  });
  // streaming: só mostra os serviços que aparecem nos títulos desta lista
  renderStreamChips($("#streamChips"), $("#streamHint"), base, state.streams, next=>{
    state.streams = next; renderChips(); renderList();
  });
}

// linha de chips de streaming, reutilizada pela lista e pela roleta
function renderStreamChips(wrap, hintEl, pool, selected, onChange){
  const avail = new Set();
  pool.forEach(i=>i.streaming.forEach(s=>avail.add(s)));
  const opts = STREAMS.filter(([n])=>avail.has(n));
  wrap.innerHTML = "";
  if(!opts.length){
    hintEl.style.display = "";
    hintEl.textContent = "Nenhum título daqui tem streaming marcado ainda. Abra uma ficha e preencha “Onde ver” para filtrar por aqui.";
    if(selected.length) onChange([]);
    return;
  }
  hintEl.style.display = "none";
  const all = document.createElement("button");
  all.className = "chip" + (selected.length===0 ? " on" : "");
  all.textContent = "Todos";
  all.onclick = ()=>onChange([]);
  wrap.appendChild(all);
  opts.forEach(([name,color])=>{
    const c = document.createElement("button");
    c.className = "chip" + (selected.includes(name) ? " on" : "");
    c.innerHTML = `<i class="dot" style="background:${color}"></i>${esc(name)}`;
    c.onclick = ()=>onChange(selected.includes(name) ? selected.filter(x=>x!==name) : [...selected,name]);
    wrap.appendChild(c);
  });
}
function renderList(){
  let rows = items.filter(i=>i.type===state.type && i.status===state.status);
  if(state.theme!=="all") rows = rows.filter(i=>i.themes.includes(state.theme));
  if(state.streams.length) rows = rows.filter(i=>i.streaming.some(s=>state.streams.includes(s)));
  if(state.sort==="az") rows.sort((a,b)=>a.name.localeCompare(b.name,"pt"));
  else rows.sort((a,b)=>{
    const pa=primary(a), pb=primary(b);
    if(pa==null && pb==null) return a.name.localeCompare(b.name,"pt");
    if(pa==null) return 1; if(pb==null) return -1;
    return pb-pa || a.name.localeCompare(b.name,"pt");
  });

  $("#countNote").textContent = rows.length ? `${rows.length} ${rows.length>1?"títulos":"título"}` : "";

  const list = $("#list");
  list.innerHTML = "";
  if(!rows.length){
    const noun = state.type==="movie" ? "filme" : "série";
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.6"/><path d="M7.4 4v16M16.6 4v16"/></svg>
      <h3>Nada por aqui</h3>
      <p>Nenhum ${noun} ${state.status==="prospect"?"na fila":"marcado como visto"}${state.theme!=="all"?" nesse tema":""}${state.streams.length?" nesse streaming":""}.</p>
    </div>`;
    return;
  }

  rows.forEach(it=>{
    const p = primary(it), sc = scoreColor(p);
    const watched = it.status==="watched";
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-main">
        <button class="card-tap" data-act="open">
          <div class="score" style="background:${sc.bg};color:${sc.fg}">${fmt(p)}</div>
          <div style="min-width:0;flex:1">
            <div class="card-title">${esc(it.name)}</div>
            ${it.director?`<div class="card-sub">${esc(it.director)}</div>`:""}
          </div>
        </button>
        <button class="check${watched?" done":""}" data-act="toggle" aria-label="Alternar visto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>
        </button>
      </div>
      ${rateChips(it)}
      ${(it.streaming.length||it.themes.length)?`<div class="card-meta">
        ${streamChips(it.streaming)}
        ${it.themes.map(t=>`<span class="tag tag-blue">${esc(t)}</span>`).join("")}
      </div>`:""}`;
    card.querySelector('[data-act="open"]').onclick   = ()=>openSheet(it.id);
    card.querySelector('[data-act="toggle"]').onclick = ()=>toggleStatus(it.id);
    list.appendChild(card);
  });
}

/* =================== ações =================== */
function toggleStatus(id){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  it.status = it.status==="prospect" ? "watched" : "prospect";
  save();
  refreshAll();
}
function removeItem(id){
  items = items.filter(i=>i.id!==id);
  save(); closeSheet(); refreshAll();
}
// um único ponto de atualização — mantém Central, listas e roleta em sincronia
function refreshAll(){
  updateSub();
  if(state.tab==="central") renderCentral();
  else if(state.tab==="movie"||state.tab==="series"){ renderChips(); renderList(); }
  if(state.tab==="roulette" && !spinning) renderRoulette();
  else if(state.tab!=="roulette") roulDirty = true;
}

/* =================== ROLETA =================== */
const WSEG = [
  {bg:"#0A4DA6",fg:"#fff"},{bg:"#D6E6FF",fg:"#0A2240"},{bg:"#0A2240",fg:"#fff"},
  {bg:"#9EC5FF",fg:"#0A2240"},{bg:"#007AFF",fg:"#fff"},{bg:"#EDF4FF",fg:"#0A2240"}
];
let roulPool = [], roulThemes = new Set(), roulStreams = [], wheelRot = 0, spinning = false, roulDirty = false;

function roulBase(){ return items.filter(i=>i.type==="movie" && i.status==="prospect"); }
function roulCandidates(){
  let pool = roulBase();
  if(roulThemes.size)   pool = pool.filter(i=>i.themes.some(t=>roulThemes.has(t)));
  if(roulStreams.length)pool = pool.filter(i=>i.streaming.some(s=>roulStreams.includes(s)));
  return pool.sort((a,b)=>a.name.localeCompare(b.name,"pt"));
}
function renderRoulChips(){
  const base = roulBase();
  const avail = new Set();
  base.forEach(i=>i.themes.forEach(t=>avail.add(t)));
  const wrap = $("#roulChips");
  wrap.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip" + (roulThemes.size===0 ? " on" : "");
  all.textContent = "Todos";
  all.onclick = ()=>{ roulThemes.clear(); renderRoulette(); };
  wrap.appendChild(all);
  THEMES.filter(t=>avail.has(t)).forEach(t=>{
    const c = document.createElement("button");
    c.className = "chip" + (roulThemes.has(t) ? " on" : "");
    c.textContent = t;
    c.onclick = ()=>{ roulThemes.has(t) ? roulThemes.delete(t) : roulThemes.add(t); renderRoulette(); };
    wrap.appendChild(c);
  });
  renderStreamChips($("#roulStreamChips"), $("#roulStreamHint"), base, roulStreams, next=>{
    roulStreams = next; renderRoulette();
  });
}
function buildWheel(pool){
  const svg = $("#wheelSvg"), NS = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  svg.style.transition = "none";
  svg.style.transform = "rotate(0deg)";
  wheelRot = 0;
  void svg.getBoundingClientRect();
  svg.style.transition = "";

  const n = pool.length, cx = 100, cy = 100, r = 95;
  if(n===0){
    const c = document.createElementNS(NS,"circle");
    c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r",r);
    c.setAttribute("fill","rgba(118,118,128,.10)");
    svg.appendChild(c); return;
  }
  const segColor = i => (i===n-1 && n>1 && (i % WSEG.length)===0) ? WSEG[1] : WSEG[i % WSEG.length];

  if(n===1){
    const c = document.createElementNS(NS,"circle");
    c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r",r);
    c.setAttribute("fill",WSEG[0].bg); svg.appendChild(c);
  } else {
    const seg = 360/n;
    for(let i=0;i<n;i++){
      const a0 = (i*seg-90)*Math.PI/180, a1 = ((i+1)*seg-90)*Math.PI/180;
      const x0 = cx+r*Math.cos(a0), y0 = cy+r*Math.sin(a0);
      const x1 = cx+r*Math.cos(a1), y1 = cy+r*Math.sin(a1);
      const p = document.createElementNS(NS,"path");
      p.setAttribute("d",`M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${seg>180?1:0},1 ${x1},${y1} Z`);
      p.setAttribute("fill",segColor(i).bg);
      p.setAttribute("stroke","#fff"); p.setAttribute("stroke-width",".7");
      svg.appendChild(p);
    }
  }
  if(n<=16){
    const seg = 360/n;
    const fs  = n<=6 ? 9 : n<=10 ? 7.6 : n<=13 ? 6.6 : 5.8;
    const max = n<=6 ? 16 : n<=10 ? 14 : 12;
    for(let i=0;i<n;i++){
      let label = pool[i].name;
      if(label.length>max) label = label.slice(0,max-1).trimEnd()+"…";
      const t = document.createElementNS(NS,"text");
      t.setAttribute("x", cx+r-9); t.setAttribute("y", cy);
      t.setAttribute("text-anchor","end"); t.setAttribute("dominant-baseline","middle");
      t.setAttribute("font-size",fs); t.setAttribute("font-weight","600");
      t.setAttribute("font-family","-apple-system,system-ui,sans-serif");
      t.setAttribute("fill",segColor(i).fg);
      t.setAttribute("transform",`rotate(${i*seg+seg/2-90} ${cx} ${cy})`);
      t.textContent = label;
      svg.appendChild(t);
    }
  }
}
function renderRoulette(){
  roulDirty = false;
  renderRoulChips();
  roulPool = roulCandidates();
  buildWheel(roulPool);
  const n = roulPool.length;
  $("#hubN").textContent = n;
  $("#hubLabel").textContent = n===1 ? "FILME" : "FILMES";
  $("#spinBtn").disabled = n<2;
  $("#spinBtn").textContent = n===0 ? "Nenhum filme na fila" : n===1 ? "Só há 1 filme na fila" : "Girar a roleta";
  const filtrado = roulThemes.size || roulStreams.length;
  $("#roulNote").textContent = n===0
    ? "Nenhum filme da fila bate com esses filtros. Ajuste os filtros acima."
    : (filtrado ? `${n} filme${n>1?"s":""} com os filtros escolhidos` : `${n} filme${n>1?"s":""} da sua fila`)
      + (n>16 ? " · os nomes aparecem ao filtrar" : "");
  const shown = $("#resCard").dataset.id;
  if(shown && !roulPool.some(i=>i.id===shown)) clearResult();
}
function clearResult(){
  $("#resModal").classList.remove("show");
  $("#resScrim").classList.remove("show");
  const c = $("#resCard"); delete c.dataset.id;
}
function spin(){
  if(spinning || roulPool.length<2) return;
  spinning = true;
  $("#spinBtn").disabled = true;
  clearResult();
  const n = roulPool.length, k = Math.floor(Math.random()*n), seg = 360/n;
  const target  = (360-(k*seg+seg/2))%360;
  const current = ((wheelRot%360)+360)%360;
  wheelRot += 360*5 + ((target-current)+360)%360;
  $("#wheelSvg").style.transform = `rotate(${wheelRot}deg)`;
  const picked = roulPool[k];
  setTimeout(()=>{
    spinning = false;
    if(roulDirty){ renderRoulette(); }
    $("#spinBtn").disabled = roulPool.length<2;
    showResult(picked);
  }, 4700);
}
function showResult(it){
  const c = $("#resCard"), p = primary(it), sc = scoreColor(p);
  c.dataset.id = it.id;
  c.innerHTML = `
    <button class="res-close" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="res-eyebrow">Sua próxima sessão</div>
    <div style="display:flex;gap:12px;align-items:flex-start;margin-top:8px;padding-right:26px">
      <div class="score" style="background:${sc.bg};color:${sc.fg}">${fmt(p)}</div>
      <div style="min-width:0;flex:1">
        <div style="font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.2">${esc(it.name)}</div>
        ${it.director?`<div class="card-sub">${esc(it.director)}</div>`:""}
      </div>
    </div>
    ${it.description?`<p style="font-size:14.5px;line-height:1.45;color:var(--label-2);margin:12px 0 0">${esc(it.description)}</p>`:""}
    ${rateChips(it)}
    ${(it.streaming.length||it.themes.length)?`<div class="card-meta">${streamChips(it.streaming)}${it.themes.map(t=>`<span class="tag tag-blue">${esc(t)}</span>`).join("")}</div>`:""}
    <div class="res-acts">
      <button class="res-watch">Marcar como visto</button>
      <button class="res-again">Girar de novo</button>
    </div>`;
  c.querySelector(".res-close").onclick = clearResult;
  c.querySelector(".res-watch").onclick = ()=>{ toggleStatus(it.id); clearResult(); renderRoulette(); };
  c.querySelector(".res-again").onclick = ()=>{ clearResult(); spin(); };
  c.scrollTop = 0;
  $("#resScrim").classList.add("show");
  $("#resModal").classList.add("show");
}

/* =================== SHEET =================== */
function buildPicks(){
  const tw = $("#themePick"); tw.innerHTML = "";
  THEMES.forEach(t=>{
    const b = document.createElement("button");
    b.className = "pick" + (state.fThemes.includes(t) ? " on" : "");
    b.textContent = t;
    b.onclick = ()=>{ state.fThemes = state.fThemes.includes(t) ? state.fThemes.filter(x=>x!==t) : [...state.fThemes,t]; buildPicks(); };
    tw.appendChild(b);
  });
  const sw = $("#streamPick"); sw.innerHTML = "";
  STREAMS.forEach(([name,color])=>{
    const b = document.createElement("button");
    b.className = "pick" + (state.fStreams.includes(name) ? " on" : "");
    b.innerHTML = `<i class="dot" style="background:${color}"></i>${esc(name)}`;
    b.onclick = ()=>{ state.fStreams = state.fStreams.includes(name) ? state.fStreams.filter(x=>x!==name) : [...state.fStreams,name]; buildPicks(); };
    sw.appendChild(b);
  });
}
function paintMine(){
  const el = $("#mineVal");
  if(state.fMine==null){ el.textContent = "—"; el.style.color = "var(--label-3)"; }
  else { el.textContent = fmt(state.fMine); el.style.color = scoreColor(state.fMine).bg; }
  $("#fMine").value = state.fMine==null ? 0 : state.fMine;
}
// aceita vírgula como separador decimal (8,4 == 8.4)
function parseNum(v){
  if(v==null) return NaN;
  const s = String(v).trim().replace(",",".");
  if(!s) return NaN;
  return parseFloat(s);
}
function setFStatus(s){
  state.fStatus = s;
  // minha nota só existe para o que já foi visto
  const seen = s==="watched";
  $("#mineBlock").style.display = seen ? "" : "none";
  $("#mineLocked").classList.toggle("show", !seen);
  if(!seen && state.fMine!=null){ state.fMine = null; paintMine(); }
  document.querySelectorAll("#segForm .seg-btn").forEach(b=>b.classList.toggle("active", b.dataset.fstatus===s));
  requestAnimationFrame(()=>moveSegThumb($("#segForm"), $("#segFormThumb"),
    [...document.querySelectorAll("#segForm .seg-btn")].find(b=>b.dataset.fstatus===s)));
}
function openSheet(id){
  state.editId = id || null;
  const it = id ? items.find(i=>i.id===id) : null;
  const kind = it ? it.type : (state.tab==="series" ? "series" : "movie");
  state.sheetType = kind;

  if(it){
    $("#sheetTitle").textContent = kind==="movie" ? "Filme" : "Série";
    $("#fName").value = it.name;
    $("#fDir").value  = it.director || "";
    $("#fDesc").value = it.description || "";
    $("#fImdb").value = it.ratings.imdb != null ? it.ratings.imdb : "";
    $("#fRt").value   = it.ratings.rt   != null ? it.ratings.rt   : "";
    state.fMine   = mineOf(it);
    state.fThemes = [...it.themes];
    state.fStreams= [...it.streaming];
    setFStatus(it.status);
    $("#delBtn").style.display = "";
  } else {
    $("#sheetTitle").textContent = kind==="movie" ? "Novo filme" : "Nova série";
    $("#fName").value=""; $("#fDir").value=""; $("#fDesc").value="";
    $("#fImdb").value=""; $("#fRt").value="";
    state.fMine=null; state.fThemes=[]; state.fStreams=[];
    setFStatus("prospect");
    $("#delBtn").style.display = "none";
  }
  paintMine(); buildPicks();
  $("#nameErr").classList.remove("show");
  $("#scrim").classList.add("show");
  $("#sheet").classList.add("open");
}
function closeSheet(){
  $("#sheet").classList.remove("open");
  $("#scrim").classList.remove("show");
}
function saveItem(){
  const name = $("#fName").value.trim();
  if(!name){ $("#nameErr").classList.add("show"); return; }
  const imdbRaw = parseNum($("#fImdb").value);
  const rtRaw   = parseNum($("#fRt").value);
  const ratings = {};
  if(state.fMine != null && state.fStatus==="watched") ratings.mine = state.fMine;
  if(!isNaN(imdbRaw)) ratings.imdb = Math.max(0, Math.min(10,  imdbRaw));
  if(!isNaN(rtRaw))   ratings.rt   = Math.max(0, Math.min(100, rtRaw));

  const data = {
    name,
    director: $("#fDir").value.trim(),
    description: $("#fDesc").value.trim(),
    themes: [...state.fThemes],
    streaming: [...state.fStreams],
    ratings,
    status: state.fStatus,
    type: state.sheetType
  };
  if(state.editId){ Object.assign(items.find(i=>i.id===state.editId), data); }
  else { items.push({ id:uid(), ...data }); }
  save();
  closeSheet();

  // leva o usuário até onde o item foi parar
  if(state.tab==="movie" || state.tab==="series"){
    if(data.type !== state.type) setTab(data.type==="movie" ? "movie" : "series");
    state.status = data.status;
    document.querySelectorAll("#seg .seg-btn").forEach(b=>b.classList.toggle("active", b.dataset.status===data.status));
    syncSeg();
  }
  refreshAll();
}

/* =================== ligações =================== */
document.querySelectorAll(".tab-item").forEach(b=> b.onclick = ()=>setTab(b.dataset.tab));
document.querySelectorAll("#seg .seg-btn").forEach(b=> b.onclick = ()=>{
  state.status = b.dataset.status;
  document.querySelectorAll("#seg .seg-btn").forEach(x=>x.classList.toggle("active", x===b));
  syncSeg(); state.theme="all"; state.streams=[]; renderChips(); renderList();
});
document.querySelectorAll("#segForm .seg-btn").forEach(b=> b.onclick = ()=>setFStatus(b.dataset.fstatus));
document.querySelectorAll(".sortpill").forEach(b=> b.onclick = ()=>{
  state.sort = b.dataset.sort;
  document.querySelectorAll(".sortpill").forEach(x=>x.classList.toggle("on", x===b));
  renderList();
});
$("#addBtn").onclick   = ()=>openSheet(null);
$("#cancelBtn").onclick= closeSheet;
$("#scrim").onclick    = closeSheet;
$("#saveBtn").onclick  = saveItem;
$("#delBtn").onclick   = ()=>{ if(state.editId) removeItem(state.editId); };
$("#fName").oninput    = ()=>$("#nameErr").classList.remove("show");
$("#fMine").oninput    = e=>{ state.fMine = parseFloat(e.target.value); paintMine(); };
$("#clearMine").onclick= ()=>{ state.fMine = null; paintMine(); };
$("#spinBtn").onclick  = spin;
$("#ctaRoul").onclick  = ()=>setTab("roulette");
$("#resScrim").onclick = clearResult;

window.addEventListener("resize", ()=>{ movePill(); syncSeg(); });
window.addEventListener("scroll", ()=>{
  $("#nav").classList.toggle("scrolled", window.scrollY > 26);
}, {passive:true});

/* =================== boot =================== */
load(); migrate(); seed(); enrich();
setTab("central");
requestAnimationFrame(()=>{ movePill(); syncSeg(); });
</script>
</body>
</html>
